# Bootloader is NOT managed by apt on this box (TOC0-signed mainline U-Boot,
# written by hand). u-boot-menu only generates /boot/extlinux/extlinux.conf.
U_BOOT_ROOT="root=LABEL=t95-root"
U_BOOT_PARAMETERS="console=ttyS0,115200n8 earlycon rootwait rw"
U_BOOT_FDT="/boot/dtbs/t95/sun50i-h616-t95.dtb"
U_BOOT_TIMEOUT="20"
