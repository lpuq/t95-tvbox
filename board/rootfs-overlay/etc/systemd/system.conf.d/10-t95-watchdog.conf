# Hardware watchdog (sunxi-wdt): systemd pets it; if the kernel or PID 1
# hangs, the SoC resets itself. The hardware maximum is 16 s, and larger
# values are rejected (EINVAL), including systemd's 10 min default for
# RebootWatchdogSec, which covers a reboot that hangs.
[Manager]
RuntimeWatchdogSec=15s
RebootWatchdogSec=15s
